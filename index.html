<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CraftMods — Minecraft Mods</title>

  <style>
    :root {
      --green: #79c668;
      --text: #f4f7fb;
      --muted: #9ba7b7;
      --border: rgba(255,255,255,.09);
      --surface: #141b27;
      --surface2: #1c2534;
      --danger: #ff7b7b;
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding-bottom: 76px;
      font-family: Arial, sans-serif;
      color: var(--text);
      background:
        linear-gradient(rgba(9,13,20,.94), rgba(9,13,20,.98)),
        linear-gradient(135deg, #17211b, #090d14);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .container {
      width: min(1180px, calc(100% - 32px));
      margin-inline: auto;
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
      background: rgba(9,13,20,.92);
      backdrop-filter: blur(18px);
    }

    .nav-inner {
      min-height: 72px;
      display: flex;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 20px;
      font-weight: 900;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: linear-gradient(135deg, #99d77d, #4d8d43);
    }

    .hero {
      min-height: 380px;
      display: grid;
      place-items: center;
      padding: 60px 0;
      text-align: center;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(44px, 8vw, 74px);
      line-height: 1;
    }

    .hero h1 span {
      color: var(--green);
    }

    .hero p {
      max-width: 600px;
      margin: 20px auto 30px;
      color: #b6c0ce;
      line-height: 1.7;
    }

    .search {
      max-width: 590px;
      margin: auto;
      display: flex;
      gap: 10px;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
    }

    .search input {
      min-width: 0;
      flex: 1;
      border: 0;
      outline: 0;
      padding: 10px 12px;
      background: transparent;
      color: var(--text);
    }

    .search button {
      border: 0;
      border-radius: 9px;
      padding: 12px 18px;
      background: var(--green);
      color: #091108;
      font-weight: 900;
    }

    .section {
      padding: 32px 0 80px;
    }

    .section-header {
      margin-bottom: 20px;
    }

    .section-header h2 {
      margin: 0;
      font-size: 28px;
    }

    .section-header p {
      margin: 7px 0 0;
      color: var(--muted);
    }

    .mods-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .mod-card {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }

    .mod-card img {
      width: 100%;
      height: 220px;
      display: block;
      object-fit: cover;
    }

    .mod-info {
      padding: 20px;
    }

    .mod-info h3 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    .mod-info p {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.6;
    }

    .button,
    .submit-button,
    .download-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 12px 18px;
      background: var(--surface);
      color: var(--text);
      font-weight: 900;
      text-decoration: none;
    }

    .button-primary,
    .submit-button,
    .download-button {
      border: 0;
      background: var(--green);
      color: #091108;
    }

    .account-panel {
      max-width: 520px;
      margin: 40px auto;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px;
      background: var(--surface);
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }

    .account-avatar {
      width: 82px;
      height: 82px;
      display: grid;
      place-items: center;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: var(--surface2);
      font-size: 38px;
    }

    .account-name {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .account-email {
      margin: 0 0 20px;
      color: var(--muted);
    }

    .account-buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .bottom-tabs {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 150;
      height: 68px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-top: 1px solid var(--border);
      background: rgba(9,13,20,.97);
      backdrop-filter: blur(18px);
    }

    .tab-button {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-weight: 900;
      touch-action: manipulation;
    }

    .tab-button span {
      display: block;
      margin-bottom: 3px;
      font-size: 20px;
    }

    .tab-button.active {
      color: var(--green);
      background: rgba(121,198,104,.06);
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 300;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(3,6,10,.78);
      backdrop-filter: blur(10px);
    }

    .modal.open {
      display: flex;
    }

    .modal-card {
      width: min(430px, 100%);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px;
      background: #141b27;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 24px;
    }

    .close-button {
      width: 36px;
      height: 36px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      font-size: 18px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 800;
    }

    .form-group input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: 0;
      padding: 12px 13px;
      background: #0d131d;
      color: var(--text);
    }

    .form-group input:focus {
      border-color: var(--green);
    }

    .submit-button {
      width: 100%;
      margin-top: 6px;
      padding: 13px;
    }

    .message {
      min-height: 20px;
      margin: 12px 0 0;
      text-align: center;
      font-size: 14px;
    }

    .success {
      color: #9be68a;
    }

    .error {
      color: var(--danger);
    }

    footer {
      border-top: 1px solid var(--border);
      background: rgba(9,13,20,.75);
    }

    .footer-inner {
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
    }

    @media (max-width: 760px) {
      .footer-inner {
        min-height: 120px;
        flex-direction: column;
        justify-content: center;
        gap: 10px;
      }
    }

    @media (max-width: 480px) {
      .container {
        width: calc(100% - 24px);
      }

      .search,
      .account-buttons {
        flex-direction: column;
      }

      .search button,
      .account-buttons .button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <nav class="navbar">
    <div class="container nav-inner">
      <a class="logo" href="#" id="homeLogo">
        <div class="logo-icon">🧱</div>
        <span>CraftMods</span>
      </a>
    </div>
  </nav>

  <main id="modsPage">
    <header class="hero">
      <div class="container">
        <h1>Craft<span>Mods</span></h1>

        <p>
          Najlepsze dodatki do Minecrafta.
          Pobieraj mody i ulepszaj swoją rozgrywkę.
        </p>

        <form class="search" id="searchForm">
          <input
            id="searchInput"
            type="search"
            placeholder="Szukaj modów..."
            aria-label="Szukaj modów"
          >
          <button type="submit">Szukaj</button>
        </form>
      </div>
    </header>

    <section class="section">
      <div class="container">
        <div class="section-header">
          <h2>Popularne mody</h2>
          <p>Najciekawsze dostępne dodatki</p>
        </div>

        <div class="mods-grid">
          <article class="mod-card" data-mod-name="multiplayer with AI">
            <img src="./mod1.jpg" alt="multiplayer with AI">

            <div class="mod-info">
              <h3>multiplayer with AI</h3>
              <p>
                Dodatek Multiplayer with AI dla Minecraft Bedrock Edition.
              </p>

              <a
                class="download-button"
                href="./mod1.mcaddon"
                download="multiplayer with AI.mcaddon"
              >
                ⬇ Pobierz mod
              </a>
            </div>
          </article>
        </div>

        <p class="message" id="searchMessage" aria-live="polite"></p>
      </div>
    </section>

    <footer>
      <div class="container footer-inner">
        <strong>CraftMods</strong>
        <span>© 2026 CraftMods</span>
      </div>
    </footer>
  </main>

  <main id="accountPage" hidden>
    <section class="section">
      <div class="container">
        <div class="account-panel" id="accountPanel"></div>
      </div>
    </section>
  </main>

  <nav class="bottom-tabs" aria-label="Główna nawigacja">
    <button
      class="tab-button active"
      type="button"
      data-page="modsPage"
      aria-selected="true"
    >
      <span>🧱</span>
      Mods
    </button>

    <button
      class="tab-button"
      type="button"
      data-page="accountPage"
      aria-selected="false"
    >
      <span>👤</span>
      Account
    </button>
  </nav>

  <div class="modal" id="registerModal" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-header">
        <h2>Utwórz konto</h2>
        <button
          class="close-button"
          type="button"
          data-close-modal="registerModal"
          aria-label="Zamknij"
        >×</button>
      </div>

      <form id="registerForm">
        <div class="form-group">
          <label for="nickname">Nick</label>
          <input
            id="nickname"
            type="text"
            minlength="3"
            maxlength="20"
            autocomplete="username"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">E-mail</label>
          <input
            id="email"
            type="email"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Hasło</label>
          <input
            id="password"
            type="password"
            minlength="8"
            autocomplete="new-password"
            required
          >
        </div>

        <div class="form-group">
          <label for="passwordConfirm">Powtórz hasło</label>
          <input
            id="passwordConfirm"
            type="password"
            minlength="8"
            autocomplete="new-password"
            required
          >
        </div>

        <button class="submit-button" type="submit">
          Zarejestruj się
        </button>

        <p class="message" id="registerMessage" aria-live="polite"></p>
      </form>
    </div>
  </div>

  <div class="modal" id="loginModal" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-header">
        <h2>Zaloguj się</h2>
        <button
          class="close-button"
          type="button"
          data-close-modal="loginModal"
          aria-label="Zamknij"
        >×</button>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">E-mail</label>
          <input
            id="loginEmail"
            type="email"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="loginPassword">Hasło</label>
          <input
            id="loginPassword"
            type="password"
            autocomplete="current-password"
            required
          >
        </div>

        <button class="submit-button" type="submit">Zaloguj</button>

        <p class="message" id="loginMessage" aria-live="polite"></p>
      </form>
    </div>
  </div>

  <script>
    const modsPage = document.getElementById("modsPage");
    const accountPage = document.getElementById("accountPage");
    const tabButtons = document.querySelectorAll(".tab-button");
    const accountPanel = document.getElementById("accountPanel");

    const registerModal = document.getElementById("registerModal");
    const loginModal = document.getElementById("loginModal");
    const registerForm = document.getElementById("registerForm");
    const loginForm = document.getElementById("loginForm");

    function showPage(pageId) {
      if (pageId !== "modsPage" && pageId !== "accountPage") {
        return;
      }

      modsPage.hidden = pageId !== "modsPage";
      accountPage.hidden = pageId !== "accountPage";

      tabButtons.forEach((button) => {
        const isActive = button.dataset.page === pageId;
        button.classList.toggle("active", isActive);
        button.setAttribute("aria-selected", String(isActive));
      });

      window.scrollTo(0, 0);
    }

    tabButtons.forEach((button) => {
      button.addEventListener("click", () => {
        showPage(button.dataset.page);
      });
    });

    document.getElementById("homeLogo").addEventListener("click", (event) => {
      event.preventDefault();
      showPage("modsPage");
    });

    function openModal(modal) {
      modal.classList.add("open");
    }

    function closeModal(modal) {
      modal.classList.remove("open");
    }

    document.querySelectorAll("[data-close-modal]").forEach((button) => {
      button.addEventListener("click", () => {
        const modal = document.getElementById(button.dataset.closeModal);
        if (modal) closeModal(modal);
      });
    });

    [registerModal, loginModal].forEach((modal) => {
      modal.addEventListener("click", (event) => {
        if (event.target === modal) {
          closeModal(modal);
        }
      });
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeModal(registerModal);
        closeModal(loginModal);
      }
    });

    function getAccounts() {
      try {
        const accounts = JSON.parse(
          localStorage.getItem("craftModsAccounts") || "[]"
        );

        return Array.isArray(accounts) ? accounts : [];
      } catch {
        return [];
      }
    }

    function setMessage(id, text, type = "") {
      const message = document.getElementById(id);
      message.textContent = text;
      message.className = `message ${type}`;
    }

    function updateAccountPanel() {
      let currentUser = null;

      try {
        currentUser = JSON.parse(
          localStorage.getItem("craftModsCurrentUser") || "null"
        );
      } catch {
        currentUser = null;
      }

      if (!currentUser) {
        accountPanel.innerHTML = `
          <div class="account-avatar">👤</div>
          <h2 class="account-name">Account</h2>
          <p class="account-email">Zaloguj się lub utwórz konto</p>

          <div class="account-buttons">
            <button class="button" type="button" id="panelLoginButton">
              Zaloguj
            </button>
            <button class="button button-primary" type="button" id="panelRegisterButton">
              Utwórz konto
            </button>
          </div>
        `;

        document
          .getElementById("panelLoginButton")
          .addEventListener("click", () => {
            setMessage("loginMessage", "");
            openModal(loginModal);
          });

        document
          .getElementById("panelRegisterButton")
          .addEventListener("click", () => {
            setMessage("registerMessage", "");
            openModal(registerModal);
          });

        return;
      }

      const safeNickname = escapeHtml(currentUser.nickname || "Account");
      const safeEmail = escapeHtml(currentUser.email || "");

      accountPanel.innerHTML = `
        <div class="account-avatar">👤</div>
        <h2 class="account-name">${safeNickname}</h2>
        <p class="account-email">${safeEmail}</p>
        <div class="account-buttons">
          <button class="button" type="button" id="logoutButton">
            Wyloguj
          </button>
        </div>
      `;

      document.getElementById("logoutButton").addEventListener("click", () => {
        localStorage.removeItem("craftModsCurrentUser");
        updateAccountPanel();
      });
    }

    function escapeHtml(value) {
      const element = document.createElement("span");
      element.textContent = String(value);
      return element.innerHTML;
    }

    registerForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const nickname = document.getElementById("nickname").value.trim();
      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value;
      const passwordConfirm = document.getElementById("passwordConfirm").value;

      if (nickname.length < 3) {
        setMessage("registerMessage", "Nick musi mieć co najmniej 3 znaki.", "error");
        return;
      }

      if (password.length < 8) {
        setMessage("registerMessage", "Hasło musi mieć co najmniej 8 znaków.", "error");
        return;
      }

      if (password !== passwordConfirm) {
        setMessage("registerMessage", "Hasła nie są jednakowe.", "error");
        return;
      }

      const accounts = getAccounts();

      if (accounts.some((account) => account.email === email)) {
        setMessage("registerMessage", "Konto z tym e-mailem już istnieje.", "error");
        return;
      }

      accounts.push({ nickname, email, password });

      try {
        localStorage.setItem("craftModsAccounts", JSON.stringify(accounts));
        setMessage("registerMessage", "Konto zostało utworzone!", "success");

        setTimeout(() => {
          closeModal(registerModal);
          registerForm.reset();
          updateAccountPanel();
        }, 700);
      } catch {
        setMessage("registerMessage", "Nie udało się zapisać konta.", "error");
      }
    });

    loginForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const email = document
        .getElementById("loginEmail")
        .value
        .trim()
        .toLowerCase();

      const password = document.getElementById("loginPassword").value;
      const account = getAccounts().find((item) => item.email === email);

      if (!account) {
        setMessage("loginMessage", "Nie znaleziono konta o tym e-mailu.", "error");
        return;
      }

      if (account.password !== password) {
        setMessage("loginMessage", "Nieprawidłowe hasło.", "error");
        return;
      }

      try {
        localStorage.setItem(
          "craftModsCurrentUser",
          JSON.stringify({
            nickname: account.nickname,
            email: account.email
          })
        );
      } catch {
        setMess
