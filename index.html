
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CraftMods — Minecraft Mods</title>

<style>
:root {
  --green:#79c668;
  --text:#f4f7fb;
  --muted:#9ba7b7;
  --border:rgba(255,255,255,.09);
  --surface:#141b27;
  --surface2:#1c2534;
  --page-bg:linear-gradient(135deg,#17211b,#090d14);
  --nav-bg:rgba(9,13,20,.95);
  --bottom-bg:rgba(9,13,20,.97);
  --modal-bg:#141b27;
  --input-bg:#0d131d;
  --danger:#ff7b7b;
  --shadow:0 20px 50px rgba(0,0,0,.35);
}

body.light {
  --text:#202a35;
  --muted:#687586;
  --border:rgba(20,35,50,.14);
  --surface:#ffffff;
  --surface2:#edf2f6;
  --page-bg:linear-gradient(135deg,#eef8eb,#f2f5fa);
  --nav-bg:rgba(255,255,255,.95);
  --bottom-bg:rgba(255,255,255,.97);
  --modal-bg:#ffffff;
  --input-bg:#f0f3f6;
  --danger:#d83c3c;
  --shadow:0 20px 50px rgba(30,50,70,.12);
}

* { box-sizing:border-box; }
[hidden] { display:none !important; }

body {
  margin:0;
  min-height:100vh;
  padding-bottom:76px;
  font-family:Arial,sans-serif;
  color:var(--text);
  background:var(--page-bg);
  transition:background .25s,color .25s;
}

a { color:inherit;text-decoration:none; }
button,input,select { font:inherit; }

.container {
  width:min(1180px,calc(100% - 32px));
  margin-inline:auto;
}

.navbar {
  position:sticky;
  top:0;
  z-index:100;
  border-bottom:1px solid var(--border);
  background:var(--nav-bg);
  backdrop-filter:blur(18px);
}

.nav-inner {
  min-height:72px;
  display:flex;
  align-items:center;
}

.logo {
  display:flex;
  align-items:center;
  gap:11px;
  font-size:20px;
  font-weight:900;
}

.logo-icon {
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  border-radius:10px;
  background:linear-gradient(135deg,#99d77d,#4d8d43);
}

.hero {
  min-height:380px;
  display:grid;
  place-items:center;
  padding:60px 0;
  text-align:center;
}

.hero h1 {
  margin:0;
  font-size:clamp(44px,8vw,74px);
  line-height:1;
}

.hero h1 span { color:var(--green); }

.hero p {
  max-width:600px;
  margin:20px auto 30px;
  color:var(--muted);
  line-height:1.7;
}

.search {
  max-width:590px;
  margin:auto;
  display:flex;
  gap:10px;
  padding:8px;
  border:1px solid var(--border);
  border-radius:14px;
  background:var(--surface);
}

.search input {
  min-width:0;
  flex:1;
  border:0;
  outline:0;
  padding:10px 12px;
  background:transparent;
  color:var(--text);
}

.search button {
  border:0;
  border-radius:9px;
  padding:12px 18px;
  background:var(--green);
  color:#091108;
  cursor:pointer;
  font-weight:900;
}

.section { padding:32px 0 80px; }

.section-header { margin-bottom:20px; }

.section-header h2 {
  margin:0;
  font-size:28px;
}

.section-header p {
  margin:7px 0 0;
  color:var(--muted);
}

.mods-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;
}

.mod-card {
  overflow:hidden;
  border:1px solid var(--border);
  border-radius:18px;
  background:var(--surface);
  box-shadow:var(--shadow);
}

.mod-card img {
  width:100%;
  height:220px;
  display:block;
  object-fit:cover;
}

.mod-info { padding:20px; }

.mod-info h3 {
  margin:0 0 8px;
  font-size:22px;
}

.mod-info p {
  margin:0 0 16px;
  color:var(--muted);
  line-height:1.6;
}

.button,.submit-button,.download-button {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border:1px solid var(--border);
  border-radius:9px;
  padding:12px 18px;
  background:var(--surface);
  color:var(--text);
  cursor:pointer;
  font-weight:900;
}

.button-primary,.submit-button,.download-button {
  border:0;
  background:var(--green);
  color:#091108;
}

.account-panel {
  max-width:520px;
  margin:40px auto;
  border:1px solid var(--border);
  border-radius:18px;
  padding:28px;
  background:var(--surface);
  text-align:center;
  box-shadow:var(--shadow);
}

.account-avatar {
  width:82px;
  height:82px;
  display:grid;
  place-items:center;
  margin:0 auto 16px;
  border-radius:50%;
  background:var(--surface2);
  font-size:38px;
}

.account-name {
  margin:0 0 8px;
  font-size:24px;
}

.account-email {
  margin:0 0 20px;
  color:var(--muted);
  overflow-wrap:anywhere;
}

.account-buttons {
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
}

.settings-panel {
  max-width:520px;
  margin:40px auto;
  border:1px solid var(--border);
  border-radius:18px;
  padding:26px;
  background:var(--surface);
  box-shadow:var(--shadow);
}

.settings-panel h2 {
  margin:0 0 24px;
  text-align:center;
}

.settings-group {
  margin-bottom:24px;
  text-align:left;
}

.settings-group label {
  display:block;
  margin-bottom:10px;
  font-weight:900;
}

.settings-select {
  width:100%;
  padding:13px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--input-bg);
  color:var(--text);
  outline:none;
}

.theme-options {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.theme-button {
  padding:14px 10px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--surface2);
  color:var(--text);
  cursor:pointer;
  font-weight:900;
}

.theme-button.selected {
  border:2px solid var(--green);
  background:rgba(121,198,104,.12);
}

.back-button {
  width:100%;
  margin-top:10px;
}

.bottom-tabs {
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:150;
  height:68px;
  display:grid;
  grid-template-columns:1fr 1fr;
  border-top:1px solid var(--border);
  background:var(--bottom-bg);
  backdrop-filter:blur(18px);
}

.tab-button {
  border:0;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  font-weight:900;
  touch-action:manipulation;
}

.tab-button span {
  display:block;
  margin-bottom:3px;
  font-size:20px;
}

.tab-button.active {
  color:var(--green);
  background:rgba(121,198,104,.06);
}

.modal {
  position:fixed;
  inset:0;
  z-index:300;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(3,6,10,.78);
  backdrop-filter:blur(10px);
}

.modal.open { display:flex; }

.modal-card {
  width:min(430px,100%);
  max-height:90vh;
  overflow-y:auto;
  border:1px solid var(--border);
  border-radius:18px;
  padding:28px;
  background:var(--modal-bg);
  box-shadow:var(--shadow);
}

.modal-header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:22px;
}

.modal-header h2 {
  margin:0;
  font-size:24px;
}

.close-button {
  width:36px;
  height:36px;
  border:1px solid var(--border);
  border-radius:8px;
  background:transparent;
  color:var(--text);
  cursor:pointer;
  font-size:18px;
}

.form-group { margin-bottom:14px; }

.form-group label {
  display:block;
  margin-bottom:7px;
  font-size:14px;
  font-weight:800;
}

.form-group input {
  width:100%;
  border:1px solid var(--border);
  border-radius:9px;
  outline:0;
  padding:12px 13px;
  background:var(--input-bg);
  color:var(--text);
}

.form-group input:focus { border-color:var(--green); }

.submit-button {
  width:100%;
  margin-top:6px;
  padding:13px;
}

.message {
  min-height:20px;
  margin:12px 0 0;
  text-align:center;
  font-size:14px;
}

.success { color:#58bd45; }
.error { color:var(--danger); }

.empty-message {
  grid-column:1/-1;
  padding:30px;
  text-align:center;
  color:var(--muted);
}

footer {
  border-top:1px solid var(--border);
  background:var(--nav-bg);
}

.footer-inner {
  min-height:100px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:var(--muted);
}

@media(max-width:760px) {
  .footer-inner {
    min-height:120px;
    flex-direction:column;
    justify-content:center;
    gap:10px;
  }
}

@media(max-width:480px) {
  .container { width:calc(100% - 24px); }

  .search,.account-buttons {
    flex-direction:column;
  }

  .search button,.account-buttons .button {
    width:100%;
  }
}
</style>
</head>

<body>

<nav class="navbar">
  <div class="container nav-inner">
    <a class="logo" href="#" id="homeLogo">
      <div class="logo-icon">🧱</div>
      <span>CraftMods</span>
    </a>
  </div>
</nav>

<main id="modsPage" class="page">

  <header class="hero">
    <div class="container">
      <h1>Craft<span>Mods</span></h1>

      <p id="heroDescription">
        Najlepsze dodatki do Minecrafta.
        Pobieraj mody i ulepszaj swoją rozgrywkę.
      </p>

      <form class="search" id="searchForm">
        <input id="searchInput" type="search"
          placeholder="Szukaj modów..."
          aria-label="Szukaj modów">
        <button type="submit" id="searchButton">Szukaj</button>
      </form>
    </div>
  </header>

  <section class="section">
    <div class="container">

      <div class="section-header">
        <h2 id="popularTitle">Popularne mody</h2>
        <p id="popularDescription">Najciekawsze dostępne dodatki</p>
      </div>

      <div class="mods-grid" id="modsGrid">
        <article class="mod-card">
          <img src="./mod1.jpg" alt="multiplayer with AI">

          <div class="mod-info">
            <h3>multiplayer with AI</h3>

            <p id="modDescription">
              Dodatek Multiplayer with AI dla Minecraft Bedrock Edition.
            </p>

            <a class="download-button"
              href="./mod1.mcaddon"
              download="multiplayer with AI.mcaddon"
              id="downloadButton">
              ⬇ Pobierz mod
            </a>
          </div>
        </article>
      </div>
    </div>
  </section>

  <footer>
    <div class="container footer-inner">
      <strong>CraftMods</strong>
      <span>© 2026 CraftMods</span>
    </div>
  </footer>

</main>

<main id="accountPage" class="page" hidden>
  <section class="section">
    <div class="container">
      <div class="account-panel" id="accountPanel"></div>
    </div>
  </section>
</main>

<nav class="bottom-tabs" aria-label="Main navigation">
  <button class="tab-button active" type="button"
    data-page="modsPage" aria-selected="true">
    <span>🧱</span>
    <span id="modsTabText">Mods</span>
  </button>

  <button class="tab-button" type="button"
    data-page="accountPage" aria-selected="false">
    <span>👤</span>
    <span id="accountTabText">Account</span>
  </button>
</nav>

<!-- REGISTER -->

<div class="modal" id="registerModal" role="dialog" aria-modal="true">
  <div class="modal-card">
    <div class="modal-header">
      <h2 id="registerTitle">Utwórz konto</h2>
      <button class="close-button" id="closeRegisterModal" type="button">×</button>
    </div>

    <form id="registerForm">
      <div class="form-group">
        <label for="nickname" id="nicknameLabel">Nick</label>
        <input id="nickname" type="text" minlength="3" maxlength="20" required>
      </div>

      <div class="form-group">
        <label for="email" id="emailLabel">E-mail</label>
        <input id="email" type="email" required>
      </div>

      <div class="form-group">
        <label for="password" id="passwordLabel">Hasło</label>
        <input id="password" type="password" minlength="8" required>
      </div>

      <div class="form-group">
        <label for="passwordConfirm" id="confirmPasswordLabel">Powtórz hasło</label>
        <input id="passwordConfirm" type="password" minlength="8" required>
      </div>

      <button class="submit-button" type="submit" id="registerButton">
        Zarejestruj się
      </button>

      <p class="message" id="registerMessage"></p>
    </form>
  </div>
</div>

<!-- LOGIN -->

<div class="modal" id="loginModal" role="dialog" aria-modal="true">
  <div class="modal-card">
    <div class="modal-header">
      <h2 id="loginTitle">Zaloguj się</h2>
      <button class="close-button" id="closeLoginModal" type="button">×</button>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="loginEmail" id="loginEmailLabel">E-mail</label>
        <input id="loginEmail" type="email" required>
      </div>

      <div class="form-group">
        <label for="loginPassword" id="loginPasswordLabel">Hasło</label>
        <input id="loginPassword" type="password" required>
      </div>

      <button class="submit-button" type="submit" id="loginButton">
        Zaloguj
      </button>

      <p class="message" id="loginMessage"></p>
    </form>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {

  const modsPage = document.getElementById("modsPage");
  const accountPage = document.getElementById("accountPage");
  const accountPanel = document.getElementById("accountPanel");

  const registerModal = document.getElementById("registerModal");
  const loginModal = document.getElementById("loginModal");

  const registerForm = document.getElementById("registerForm");
  const loginForm = document.getElementById("loginForm");

  const tabs = document.querySelectorAll(".tab-button");

  // TRANSLATIONS

  const translations = {
    pl: {
      heroDescription:"Najlepsze dodatki do Minecrafta. Pobieraj mody i ulepszaj swoją rozgrywkę.",

      settings:"Ustawienia",

      theme:"Motyw",

      back:"← Wróć do konta",
      registerTitle:"Utwórz konto",
      nickname:"Nick",
      email:"E-mail",
      password:"Hasło",
      confirmPassword:"Powtórz hasło",
      register:"Zarejestruj się",
      loginTitle:"Zaloguj się",
      loginButton:"Zaloguj",
      noMods:"Nie znaleziono modów.",
      nickShort:"Nick musi mieć minimum 3 znaki.",
      passwordShort:"Hasło musi mieć minimum 8 znaków.",
      passwordMismatch:"Hasła nie są jednakowe.",
      emailExists:"Ten e-mail już istnieje.",
      accountCreated:"Konto utworzone!",
      saveError:"Błąd zapisywania konta.",
      wrongLogin:"Nieprawidłowy e-mail lub hasło.",
      loggedIn:"Zalogowano!",
      loginError:"Błąd logowania."
    },

    en: {
      heroDescription:"The best Minecraft addons. Download mods and improve your gameplay.",
      searchPlaceholder:"Search mods...",
      searchButton:"Search",
      popularTitle:"Popular mods",
      popularDescription:"The most interesting available addons",
      modDescription:"Multiplayer with AI addon for Minecraft Bedrock Edition.",
      download:"⬇ Download mod",
      mods:"Mods",
      account:"Account",
      accountTitle:"Account",
      notLogged:"Log in or create an account",
      createAccount:"Create account",
      login:"Log in",
      logout:"Log out",
      settings:"Settings",
      settingsTitle:"Settings",
      language:"Language",
      theme:"Theme",

    },

    ru: {

      searchButton:"Искать",

      download:"⬇ Скачать мод",

      wrongLogin:"Неверная почта или пароль.",
      loggedIn:"Вход выполнен!",
      loginError:"Ошибка входа."
    }
  };

  function getLanguage() {
    const saved = localStorage.getItem("craftModsLanguage");
    return translations[saved] ? saved : "pl";
  }

  function getTheme() {
    return localStorage.getItem("craftModsTheme") === "light"
      ? "light"
      : "dark";
  }

  let currentLanguage = getLanguage();
  let currentTheme = getTheme();

  function t(key) {
    return translations[currentLanguage][key] || key;
  }

  // THEME

  function applyTheme() {
    document.body.classList.toggle("light", currentTheme === "light");
    document.documentElement.style.colorScheme = currentTheme;
  }

  function setTheme(theme) {
    currentTheme = theme;
    localStorage.setItem("craftModsTheme", theme);
    applyTheme();

    if (document.getElementById("settingsPanel")) {
      showSettings();
    }
  }

  // LANGUAGE

  function setLanguage(language) {
    if (!translations[language]) return;

    currentLanguage = language;
    localStorage.setItem("craftModsLanguage", language);

    applyTranslations();
    updateAccountPanel();
  }

  function applyTranslations() {
    document.documentElement.lang = currentLanguage;

    document.getElementById("heroDescription").textContent = t("heroDescription");
    document.getElementById("searchInput").placeholder = t("searchPlaceholder");
    document.getElementById("searchInput").setAttribute("aria-label", t("searchPlaceholder"));

    document.getElementById("loginEmailLabel").textContent = t("email");
    document.getElementById("loginPasswordLabel").textContent = t("password");
    document.getElementById("loginButton").textContent = t("loginButto
