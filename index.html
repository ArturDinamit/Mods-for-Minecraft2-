
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CraftMods — Minecraft Mods</title>

<style>
:root {
  --green:#79c668;
  --text:#f4f7fb;
  --muted:#9ba7b7;
  --border:rgba(255,255,255,.09);
  --surface:#141b27;
  --surface2:#1c2534;
  --danger:#ff7b7b;
}

* { box-sizing:border-box; }
[hidden] { display:none !important; }

body {
  margin:0;
  min-height:100vh;
  padding-bottom:76px;
  font-family:Arial,sans-serif;
  color:var(--text);
  background:linear-gradient(135deg,#17211b,#090d14);
}

a { color:inherit;text-decoration:none; }
button,input { font:inherit; }

.container {
  width:min(1180px,calc(100% - 32px));
  margin-inline:auto;
}

.navbar {
  position:sticky;
  top:0;
  z-index:100;
  border-bottom:1px solid var(--border);
  background:rgba(9,13,20,.95);
  backdrop-filter:blur(18px);
}

.nav-inner {
  min-height:72px;
  display:flex;
  align-items:center;
}

.logo {
  display:flex;
  align-items:center;
  gap:11px;
  font-size:20px;
  font-weight:900;
}

.logo-icon {
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  border-radius:10px;
  background:linear-gradient(135deg,#99d77d,#4d8d43);
}

.hero {
  min-height:380px;
  display:grid;
  place-items:center;
  padding:60px 0;
  text-align:center;
}

.hero h1 {
  margin:0;
  font-size:clamp(44px,8vw,74px);
  line-height:1;
}

.hero h1 span { color:var(--green); }

.hero p {
  max-width:600px;
  margin:20px auto 30px;
  color:#b6c0ce;
  line-height:1.7;
}

.search {
  max-width:590px;
  margin:auto;
  display:flex;
  gap:10px;
  padding:8px;
  border:1px solid var(--border);
  border-radius:14px;
  background:var(--surface);
}

.search input {
  min-width:0;
  flex:1;
  border:0;
  outline:0;
  padding:10px 12px;
  background:transparent;
  color:var(--text);
}

.search button {
  border:0;
  border-radius:9px;
  padding:12px 18px;
  background:var(--green);
  color:#091108;
  cursor:pointer;
  font-weight:900;
}

.section { padding:32px 0 80px; }

.section-header { margin-bottom:20px; }

.section-header h2 {
  margin:0;
  font-size:28px;
}

.section-header p {
  margin:7px 0 0;
  color:var(--muted);
}

.mods-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;
}

.mod-card {
  overflow:hidden;
  border:1px solid var(--border);
  border-radius:18px;
  background:var(--surface);
  box-shadow:0 20px 50px rgba(0,0,0,.35);
}

.mod-card img {
  width:100%;
  height:220px;
  display:block;
  object-fit:cover;
}

.mod-info { padding:20px; }

.mod-info h3 {
  margin:0 0 8px;
  font-size:22px;
}

.mod-info p {
  margin:0 0 16px;
  color:var(--muted);
  line-height:1.6;
}

.button,.submit-button,.download-button {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border:1px solid var(--border);
  border-radius:9px;
  padding:12px 18px;
  background:var(--surface);
  color:var(--text);
  cursor:pointer;
  font-weight:900;
}

.button-primary,.submit-button,.download-button {
  border:0;
  background:var(--green);
  color:#091108;
}

.account-panel {
  max-width:520px;
  margin:40px auto;
  border:1px solid var(--border);
  border-radius:18px;
  padding:28px;
  background:var(--surface);
  text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,.35);
}

.account-avatar {
  width:82px;
  height:82px;
  display:grid;
  place-items:center;
  margin:0 auto 16px;
  border-radius:50%;
  background:var(--surface2);
  font-size:38px;
}

.account-name {
  margin:0 0 8px;
  font-size:24px;
}

.account-email {
  margin:0 0 20px;
  color:var(--muted);
}

.account-buttons {
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
}

.bottom-tabs {
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:150;
  height:68px;
  display:grid;
  grid-template-columns:1fr 1fr;
  border-top:1px solid var(--border);
  background:rgba(9,13,20,.97);
  backdrop-filter:blur(18px);
}

.tab-button {
  border:0;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  font-weight:900;
  touch-action:manipulation;
}

.tab-button span {
  display:block;
  margin-bottom:3px;
  font-size:20px;
}

.tab-button.active {
  color:var(--green);
  background:rgba(121,198,104,.06);
}

.modal {
  position:fixed;
  inset:0;
  z-index:300;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(3,6,10,.78);
  backdrop-filter:blur(10px);
}

.modal.open { display:flex; }

.modal-card {
  width:min(430px,100%);
  max-height:90vh;
  overflow-y:auto;
  border:1px solid var(--border);
  border-radius:18px;
  padding:28px;
  background:#141b27;
  box-shadow:0 20px 50px rgba(0,0,0,.35);
}

.modal-header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:22px;
}

.modal-header h2 {
  margin:0;
  font-size:24px;
}

.close-button {
  width:36px;
  height:36px;
  border:1px solid var(--border);
  border-radius:8px;
  background:transparent;
  color:var(--text);
  cursor:pointer;
  font-size:18px;
}

.form-group { margin-bottom:14px; }

.form-group label {
  display:block;
  margin-bottom:7px;
  font-size:14px;
  font-weight:800;
}

.form-group input {
  width:100%;
  border:1px solid var(--border);
  border-radius:9px;
  outline:0;
  padding:12px 13px;
  background:#0d131d;
  color:var(--text);
}

.form-group input:focus { border-color:var(--green); }

.submit-button {
  width:100%;
  margin-top:6px;
  padding:13px;
}

.message {
  min-height:20px;
  margin:12px 0 0;
  text-align:center;
  font-size:14px;
}

.success { color:#9be68a; }
.error { color:var(--danger); }

.empty-message {
  grid-column:1/-1;
  padding:30px;
  text-align:center;
  color:var(--muted);
}

footer {
  border-top:1px solid var(--border);
  background:rgba(9,13,20,.75);
}

.footer-inner {
  min-height:100px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:var(--muted);
}

@media(max-width:760px) {
  .footer-inner {
    min-height:120px;
    flex-direction:column;
    justify-content:center;
    gap:10px;
  }
}

@media(max-width:480px) {
  .container { width:calc(100% - 24px); }

  .search,.account-buttons {
    flex-direction:column;
  }

  .search button,.account-buttons .button {
    width:100%;
  }
}
</style>
</head>

<body>

<nav class="navbar">
  <div class="container nav-inner">
    <a class="logo" href="#" id="homeLogo">
      <div class="logo-icon">🧱</div>
      <span>CraftMods</span>
    </a>
  </div>
</nav>

<main id="modsPage" class="page">

  <header class="hero">
    <div class="container">
      <h1>Craft<span>Mods</span></h1>

      <p>
        Najlepsze dodatki do Minecrafta.
        Pobieraj mody i ulepszaj swoją rozgrywkę.
      </p>

      <form class="search" id="searchForm">
        <input
          id="searchInput"
          type="search"
          placeholder="Szukaj modów..."
          aria-label="Szukaj modów"
        >
        <button type="submit">Szukaj</button>
      </form>
    </div>
  </header>

  <section class="section">
    <div class="container">

      <div class="section-header">
        <h2>Popularne mody</h2>
        <p>Najciekawsze dostępne dodatki</p>
      </div>

      <div class="mods-grid" id="modsGrid">

        <article class="mod-card">
          <img src="./mod1.jpg" alt="multiplayer with AI">

          <div class="mod-info">
            <h3>multiplayer with AI</h3>

            <p>
              Dodatek Multiplayer with AI dla Minecraft Bedrock Edition.
            </p>

            <a
              class="download-button"
              href="./mod1.mcaddon"
              download="multiplayer with AI.mcaddon"
            >
              ⬇ Pobierz mod
            </a>
          </div>
        </article>

      </div>
    </div>
  </section>

  <footer>
    <div class="container footer-inner">
      <strong>CraftMods</strong>
      <span>© 2026 CraftMods</span>
    </div>
  </footer>

</main>

<main id="accountPage" class="page" hidden>
  <section class="section">
    <div class="container">
      <div class="account-panel" id="accountPanel"></div>
    </div>
  </section>
</main>

<nav class="bottom-tabs" aria-label="Główna nawigacja">

  <button
    class="tab-button active"
    type="button"
    data-page="modsPage"
    aria-selected="true"
  >
    <span>🧱</span>
    Mods
  </button>

  <button
    class="tab-button"
    type="button"
    data-page="accountPage"
    aria-selected="false"
  >
    <span>👤</span>
    Account
  </button>

</nav>

<!-- REGISTER -->

<div class="modal" id="registerModal" role="dialog" aria-modal="true">
  <div class="modal-card">

    <div class="modal-header">
      <h2>Utwórz konto</h2>

      <button class="close-button" id="closeRegisterModal" type="button">
        ×
      </button>
    </div>

    <form id="registerForm">

      <div class="form-group">
        <label for="nickname">Nick</label>
        <input id="nickname" type="text" minlength="3" maxlength="20" required>
      </div>

      <div class="form-group">
        <label for="email">E-mail</label>
        <input id="email" type="email" required>
      </div>

      <div class="form-group">
        <label for="password">Hasło</label>
        <input id="password" type="password" minlength="8" required>
      </div>

      <div class="form-group">
        <label for="passwordConfirm">Powtórz hasło</label>
        <input id="passwordConfirm" type="password" minlength="8" required>
      </div>

      <button class="submit-button" type="submit">
        Zarejestruj się
      </button>

      <p class="message" id="registerMessage"></p>

    </form>
  </div>
</div>

<!-- LOGIN -->

<div class="modal" id="loginModal" role="dialog" aria-modal="true">
  <div class="modal-card">

    <div class="modal-header">
      <h2>Zaloguj się</h2>

      <button class="close-button" id="closeLoginModal" type="button">
        ×
      </button>
    </div>

    <form id="loginForm">

      <div class="form-group">
        <label for="loginEmail">E-mail</label>
        <input id="loginEmail" type="email" required>
      </div>

      <div class="form-group">
        <label for="loginPassword">Hasło</label>
        <input id="loginPassword" type="password" required>
      </div>

      <button class="submit-button" type="submit">
        Zaloguj
      </button>

      <p class="message" id="loginMessage"></p>

    </form>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {

  const modsPage = document.getElementById("modsPage");
  const accountPage = document.getElementById("accountPage");
  const accountPanel = document.getElementById("accountPanel");

  const registerModal = document.getElementById("registerModal");
  const loginModal = document.getElementById("loginModal");

  const registerForm = document.getElementById("registerForm");
  const loginForm = document.getElementById("loginForm");

  const tabs = document.querySelectorAll(".tab-button");

  // TABS

  function showPage(page) {

    if (page !== "modsPage" && page !== "accountPage") return;

    modsPage.hidden = page !== "modsPage";
    accountPage.hidden = page !== "accountPage";

    tabs.forEach(function(tab) {
      const active = tab.dataset.page === page;

      tab.classList.toggle("active", active);
      tab.setAttribute("aria-selected", String(active));
    });

    window.scrollTo(0, 0);
  }

  tabs.forEach(function(tab) {
    tab.addEventListener("click", function() {
      showPage(tab.dataset.page);
    });
  });

  document.getElementById("homeLogo").addEventListener("click", function(e) {
    e.preventDefault();
    showPage("modsPage");
  });

  // MODALS

  function openModal(modal) {
    modal.classList.add("open");
  }

  function closeModal(modal) {
    modal.classList.remove("open");
  }

  document.getElementById("closeRegisterModal").addEventListener("click", function() {
    closeModal(registerModal);
  });

  document.getElementById("closeLoginModal").addEventListener("click", function() {
    closeModal(loginModal);
  });

  [registerModal, loginModal].forEach(function(modal) {
    modal.addEventListener("click", function(e) {
      if (e.target === modal) closeModal(modal);
    });
  });

  document.addEventListener("keydown", function(e) {
    if (e.key === "Escape") {
      closeModal(registerModal);
      closeModal(loginModal);
    }
  });

  // STORAGE

  function getAccounts() {
    try {
      const data = JSON.parse(
        localStorage.getItem("craftModsAccounts") || "[]"
      );

      return Array.isArray(data) ? data : [];

    } catch {
      return [];
    }
  }

  function getCurrentUser() {
    try {
      return JSON.parse(
        localStorage.getItem("craftModsCurrentUser") || "null"
      );
    } catch {
      return null;
    }
  }

  function setMessage(id, text, type) {
    const element = document.getElementById(id);

    element.textContent = text;
    element.className = "message " + (type || "");
  }

  function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, function(char) {
      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[char];
    });
  }

  // REGISTER

  registerForm.addEventListener("submit", function(e) {

    e.preventDefault();

    const nickname = document.getElementById("nickname").value.trim();
    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;
    const confirm = document.getElementById("passwordConfirm").value;

    if (nickname.length < 3) {
      setMessage("registerMessage", "Nick musi mieć minimum 3 znaki.", "error");
      return;
    }

    if (password.length < 8) {
      setMessage("registerMessage", "Hasło musi mieć minimum 8 znaków.", "error");
      return;
    }

    if (password !== confirm) {
      setMessage("registerMessage", "Hasła nie są jednakowe.", "error");
      return;
    }

    const accounts = getAccounts();

    if (accounts.some(function(a) {
      return a.email === email;
    })) {
      setMessage("registerMessage", "Ten e-mail już istnieje.", "error");
      return;
    }

    const account = {
      nickname: nickname,
      email: email,
      password: password
    };

    accounts.push(account);

    try {

      localStorage.setItem(
        "craftModsAccounts",
        JSON.stringify(accounts)
      );

      localStorage.setItem(
        "craftModsCurrentUser",
        JSON.stringify({
          nickname: nickname,
          email: email
        })
      );

      setMessage("registerMessage", "Konto utworzone!", "success");

      setTimeout(function() {
        closeModal(registerModal);
        registerForm.reset();
        updateAccountPanel();
      }, 500);

    } catch(error) {

      setMessage("registerMessage", "Błąd zapisywania konta.", "error");

    }

  });

  // LOGIN

  loginForm.addEventListener("submit", function(e) {

    e.preventDefault();

    const email = document.getElementById("loginEmail").value.trim().toLowerCase();
    const password = document.getElementById("loginPassword").value;

    const account = getAccounts().find(function(a) {
      return a.email === email;
    });

    if (!account || account.password !== password) {
      setMessage("loginMessage", "Nieprawidłowy e-mail lub hasło.", "error");
      return;
    }

    try {

      localStorage.setItem(
        "craftModsCurrentUser",
        JSON.stringify({
          nickname: account.nickname,
          email: account.email
        })
      );

      setMessage("loginMessage", "Zalogowano!", "success");

      setTimeout(function() {
        closeModal(loginModal);
        loginForm.reset();
        updateAccountPanel();
      }, 500);

    } catch(error) {

      setMessage("loginMessage", "Błąd logowania.", "error");

    }

  });

  // ACCOUNT PANEL

  function updateAccountPanel() {

    const user = getCurrentUser();

    if (!user || !user.nickname || !user.email) {

      accountPanel.innerHTML = `
        <div class="account-avatar">👤</div>

        <h2 class="account-name">Account</h2>

        <p class="account-email">
          Zaloguj się lub utwórz konto
        </p>

        <div class="account-buttons">

          <button class="button button-primary" id="openRegister">
            Utwórz konto
          </button>

          <button class="button" id="openLogin">
            Zaloguj się
          </button>

        </div>
      `;

      document.getElementById("openRegister").addEventListener("click", function() {
        openModal(registerModal);
      });

      document.getElementById("openLogin").addEventListener("click", function() {
        openModal(loginModal);
      });

    } else {

      accountPanel.innerHTML = `
        <div class="account-avatar">👤</div>

        <h2 class="account-name">
          ${escapeHTML(user.nickname)}
        </h2>

        <p class="account-email">
          ${escapeHTML(user.email)}
        </p>

        <div class="account-buttons">

          <button class="button" id="logoutButton">
            Wyloguj się
          </button>

        </div>
      `;

      document.getElementById("logoutButton").addEventListener("click", function() {

        localStorage.removeItem("craftModsCurrentUser");

        updateAccountPanel();

      });

    }

  }

  // SEARCH

  const searchForm = document.getElementById("searchForm");
  const searchInput = document.getElementById("searchInput");
  const modsGrid = document.getElementById("modsGrid");

  searchForm.addEventListener("submit", function(e) {

    e.preventDefault();

    const query = searchInput.value.trim().toLowerCase();

    const cards = modsGrid.querySelectorAll(".mod-card");
    let found = 0;

    cards.forEach(function(card) {

      const text = card.textContent.toLowerCase();
      const match = text.includes(query);

      card.hidden = !match;

      if (match) found++;

    });

    let empty = document.getElementById("emptySearch");

    if (!empty) {
      empty = document.createElement("div");
      empty.id = "emptySearch";
      empty.className = "empty-message";
      modsGrid.appendChild(empty);
    }

    empty.hidden = found !== 0;
    empty.textContent = "Nie znaleziono modów.";

  });

  // INITIALIZATION

  updateAccountPanel();
  showPage("modsPage");

});
</script>

</body>
</html>
